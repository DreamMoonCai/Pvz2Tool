ui:
  title:
    topAppBar: "{{icon|width=200|height=40:egame_sdk_game_logo.png}}·迷宫拓展版"
    about: "关于版本"
    coreFunction: "核心功能"
    versionManage: "版本管理"

  button:
    enterGame: "进入游戏"
    isEnterGameDefaultIcon: true # 是否使用默认图标
    tutorial: "教程"
    isTutorialDefaultIcon: true # 是否使用默认图标
    resetData: "重置数据包"
    isResetDataDefaultIcon: true # 是否使用默认图标
    showFloatingWindow: "工具悬窗"
    confirmVersion: "选定版本"

  extractor:
    dialogTitle:  "戴夫的工具箱 | 资源更新"
    initialLoadingProgressTip: "戴夫正在清点物资清单..."
    initialProgressTip: "戴夫检测到新的版本波动啦，准备更新物资..."
    noNeedExtractTip: "戴夫检查了工具箱，暂时没有新物资需要更新~"
    singleFileProcessingTip: "戴夫正在手忙脚乱整理物资："
    multiFileProcessingTip: "戴夫正在手忙脚乱整理%d个物资："
    waitingTip: "戴夫正在整理物资，旅途中稍等片刻~"
    extractCompleteTip: "物资更新完毕！\n准备好再次迎战僵尸了吗，玩家！\n【%s】"
    extractFailTipPrefix: "糟糕！戴夫的工具箱出问题了："
    fileSkipTipPrefix: "戴夫检查到「%s」无需更新，跳过啦~"
    continueButtonText: "继续物资准备"
    completeButtonText: "重返战场"
    toastErrorPrefix: "戴夫的小提示：更新失败啦 → " # 此文本不支持复合颜色

  save:
    # 弹窗标题
    presetConfirmTitle: "应用预设存档"
