    coverConfirmMessage: "确定要将当前存档覆盖到游戏吗？\n原有游戏进度将被替换！"
    deleteGameSaveConfirmTitle: "删除游玩存档"
    deleteGameSaveConfirmMessage: "此操作将永久清空您当前的游戏进度，删除后无法恢复！确定要继续吗？"
