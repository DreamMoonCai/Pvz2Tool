# ------------------------------
# 游戏主 Activity
# ------------------------------
#gameActivity: com.popcap.pvz2cmhd360.SexyAppActivity
gameActivity: com.popcap.pvz2cmhd.SexyAppActivity

# ------------------------------
# 本地读取配置文件，优先读取本地配置文件属性
#
# 配置文件必须在 pvz2tool 文件夹的子目录，否则无法使用
#
# 使用此属性需要文件存储权限否则可能不生效，或者使用设置里面的手动选定(通过SFM选择文件夹解压速度较慢)
# ------------------------------
#localConfigFile: /storage/emulated/0/Android/data/io.github.dreammooncai.pvz2tool/files/pvz2tool/dream.yml
#localConfigFile: /storage/emulated/0/植物大战僵尸2工具箱/pvz2tool/dream.yml

# ------------------------------
# 游戏默认SMF存放目录
# 当 section 不填写 targetPath 时，默认使用此目录
# ------------------------------
smfDirectory: files/

# ------------------------------
# 精简模式
# 开启后跳过完整主界面，只解压 base 资源后直接进入游戏
# CG 开场视频仍会正常播放
#
# 精简模式下只需最少配置，示例：
#   gameActivity: com.popcap.pvz2cmhd.SexyAppActivity
#   simplifiedLaunch: true
#   # baseAssetPath: version/base/smf  （可选，默认值如左）
#   # smfDirectory: files/              （可选，默认值如左）
#   # cgVideoPath: opening.mp4          （可选，CG 视频路径）
#   # cgVideoPoster: poster.jpg         （可选，CG 超时海报图）
#   # cgVideoLoadTimeout: 5000          （可选，CG 超时毫秒）
#   # gameActivityInvalid: "..."        （可选，Activity 错误提示）
# 其余字段（versions、sections、ui 大部分等）均不需要
# ------------------------------
simplifiedLaunch: false

# ------------------------------
# 关于复合颜色文本说明
#
# 以下所有文本除了明确写了不支持以外，都支持复合颜色文本
# 支持复合颜色文本的文字都可以在里面更换部分颜色文字
# 1. 颜色标签：使用 {{样式名:文本内容}}
#    支持核心颜色: "green", "purple", "red", "gold", "gray", "white", "olive"
#    带阴影版本: 在颜色后加 "-shadow"，如 {{red-shadow:文本}}
#
# 2. 链接标签：使用 {{link|URL:显示文本}}
#    普通链接: {{link|https://github.com:点击跳转}} (默认蓝色)
#    带样式链接: 使用 {{link-样式名|URL:显示文本}}
#    例如: {{link-red-shadow|https://xxx.com:红色阴影的链接}}
#
# 3. 图标标签：使用 {{icon:文件名}}
#    图标会自动从 pvz2tool 目录中的 images/ 下读取。
#    例如: {{icon:sun.png}} 对应路径为 images/sun.png
# ------------------------------
# 版本配置
# ------------------------------
versions:
  - id: "old"
    name: "怀旧服"
    desc: "经典怀旧"
    icon: "old_version_icon.png"
    default: false
    # 可选：是否自带base目录的基础包 默认自带 取消此属性可以使用 baseAssetPath: null
    # baseAssetPath: "version/base/smf"
    # 可选：如果该版本有专属的资源目录，填在这里 默认 version/old/smf
    # assetPath: "version/old/smf"
    # 游戏存档版本隔离：切换版本时会自动备份/恢复存档（存放在应用私有目录）

    # ------------------------------
    # 进入游戏前执行的 JS 脚本（可选）
    # 完整 API 文档见: js_documentation.md
    # ------------------------------
    # enterGameScript: |
    #   console.log("进入游戏前的全局脚本");
    #   console.log("当前版本: " + this.version.name);
    #   "脚本执行完成";


  - id: "new"
    name: "正式服"
    desc: "全新体验"
    icon: "new_version_icon.png"
    default: true
    # 游戏存档版本隔离：切换版本时会自动备份/恢复存档

# 版本管理面板是否默认展开
isExpandedVersions: false

# 版本管理面板的主题颜色（右侧固定的版本选择区域）
# 可选值：BROWN（默认棕色）| BLUE | BLUE_BACKGROUND | GREEN | GREEN_BACKGROUND
#         RED | PURPLE | PURPLE_BACKGROUND | ORANGE | TEAL | TEAL_BACKGROUND
#         GOLD | GRAY | GRAY_BACKGROUND
# 带 _BACKGROUND 后缀 = 深色背景+亮色文字（适合深色风格）
versionsTheme: "BROWN"

# ------------------------------
# 【核心】动态栏目配置
# ------------------------------
sections:
  # ==========================================
  # 栏目: 音频设置
  # 控制背景音乐和音效音量
  # ==========================================
  - id: "audio_settings"
    title: "音频设置"
    theme: "TEAL"

    items:
      # ----- 背景音乐音量 -----
      - id: "bgm_volume"
        name: "背景音乐音量"
        desc: "控制背景音乐的音量大小"
        type: "SLIDER"
        minValue: 0.0
        maxValue: 1.0
        step: 0.01
        defaultValue: 0.8
        valueSuffix: ""
        jsScript: |-
          audio.setBgmVolume(this.value);

      # ----- 音效音量 -----
      - id: "sfx_volume"
        name: "音效音量"
        desc: "控制按钮音效等音量大小"
        type: "SLIDER"
        minValue: 0.0
        maxValue: 1.0
        step: 0.01
        defaultValue: 1.0
        valueSuffix: ""
        jsScript: |-
          audio.setSfxVolume(this.value);
  # ==========================================
  # 栏目 1: 存档管理
  # 类型: 单选 (RADIO)
  # 目标: 自定义目录
  # ==========================================
  - id: "saves"
    title: "存档管理"
    isExpanded: false
    targetPath: "com.popcap.pvz2restartNo_Backup"

    items:
      - id: "save_1"
        name: "存档1"
        desc: "新手-1-5"
        type: "RADIO"
        icon: "save_icon.png"
        assetPath: "saves/save_1"
        default: true

      - id: "save_2"
        name: "存档2"
        desc: "进阶-10-20"
        type: "RADIO"
        icon: "save_icon.png"
        assetPath: "saves/save_2"

  - id: "saves_info"
    title: "存档信息"
    theme: "RED"

    items:
      - id: "GoldQuantity"
        name: "金币数量"
        desc: "查看你存档中当前的金币数量"
        type: "INFO"
        infoValue: "暂无金币信息"
        jsScript: |-
          var saves = pvz.saves.load();
          var datas = saves.objects[0].objdata
          datas.c.解密
      - id: "DiamondQuantity"
        name: "钻石数量"
        desc: "查看你存档中当前的钻石数量"
        type: "INFO"
        infoValue: "暂无钻石信息"
        jsScript: |-
          var saves = pvz.saves.load();
          var datas = saves.objects[0].objdata
          datas.g.解密
      - id: "PlantQuantity"
        name: "植物数量"
        desc: "查看你存档中当前的植物数量"
        type: "INFO"
        infoValue: "暂无植物信息"
        jsScript: |-
          var saves = pvz.saves.load();
          var datas = saves.objects[0].objdata
          datas.p.length


  # ==========================================
  # 栏目 2: 功能管理
  # 类型: 多选 (CHECKBOX)
  # ==========================================
  - id: "features"
    title: "功能管理"
    theme: "BLUE"
    # 不写 targetPath，默认使用上面的 smfDirectory (files/)
    # addItems: false  # 本地配置专属：true=追加到同名 APK 内置栏目；false(默认)=替换

    # 可见性控制：只有选中以下版本ID时才显示此栏目
    visibleOnVersionIds: [ "old","new" ]

    items:
      - id: "auto_collect"
        name: "阳光自动收集"
        desc: "解放双手"
        type: "CHECKBOX"
        icon: "auto_collect.png"
        smfList: [ "dynamic" ]
        jsPath: "version/auto_collect.js"

  # ==========================================
  # 栏目: 福利中心 - GOLD
  # 展示 INPUT + BUTTON 组合：礼品码兑换功能
  # ==========================================
  - id: "welfare"
    title: "福利中心"
    theme: "GOLD"

    items:
      # ----- 礼品码说明 -----
      - id: "welfare_header"
        desc: "🎁 输入礼品码即可领取豪华礼包"
        type: "DESCRIPTION"

      # ----- 礼品码输入框 -----
      - id: "giftcode_input"
        name: "礼品码"
        desc: "请输入礼品码"
        type: "INPUT"
        placeholder: "请输入礼品码"
        inputDefault: ""

      # ----- 兑换按钮 -----
      - id: "redeem_giftcode"
        type: "BUTTON"
        buttonText: "🎁 立即兑换"
        buttonColor: "green"
        jsPath: "giftcode/redeem_giftcode.js"

      # ----- 分隔线 -----
      - id: "welfare_sep_1"
        desc: "────────────────────────────"
        type: "DESCRIPTION"

      # ----- 礼品码状态提示 -----
      - id: "welfare_status"
        name: "兑换记录"
        desc: "查看你总计兑换过多少个礼品码"
        type: "INFO"
        infoValue: "暂无兑换记录"
        jsPath: "giftcode/welfare_status.js"

      # ----- 查看已使用礼品码按钮 -----
      - id: "show_used_codes"
        name: "查看兑换记录"
        desc: "查看所有已成功兑换的礼品码"
        type: "BUTTON"
        buttonColor: "blue"
        jsPath: "giftcode/show_used_codes.js"

      # ----- 分隔线 -----
      - id: "welfare_sep_2"
        name: ""
        desc: "────────────────────────────"
        type: "DESCRIPTION"


  # ==========================================
  # 栏目 3: 功能说明
  # 类型: 纯文本 (DESCRIPTION)
  # ==========================================
  - id: "instructions"
    title: "功能说明"
    items:
      - id: "desc_1"
        name: ""
        desc: "1. 存档切换即时生效"
        type: "DESCRIPTION"
      - id: "desc_2"
        name: ""
        desc: "2. 版本切换需重启应用"
        type: "DESCRIPTION"
      - id: "desc_3"
        name: ""
        desc: "3. 功能开关实时生效，不同版本功能不同"
        type: "DESCRIPTION"


  # ==========================================
  # 栏目: JS 执行器测试
  # 测试新增的 js.run()/js.call()/js.执行() API
  # ==========================================
  - id: "js_executor_demo"
    title: "JS 执行器测试"
    theme: "PURPLE"

    items:
      # ----- 测试0：执行简单表达式 -----
      - id: "js_exec_expr_ui"
        name: "执行指定表达式"
        desc: "测试 js.run() 执行输入 JS 表达式"
        type: "BUTTON"
        buttonColor: "purple"
        jsScript: |-
          js.run(ui.prompt("输入JS代码", "请输入JS代码/JS路径/JS本地绝对路径", ""));
      # ----- 测试1：执行简单表达式 -----
      - id: "js_exec_expr"
        name: "执行表达式"
        desc: "测试 js.run() 执行简单 JS 表达式"
        type: "BUTTON"
        buttonColor: "purple"
        jsScript: |-
          var result = js.run("1 + 2");
          "1 + 2 = " + result;

      # ----- 测试2：执行 JS 文件 -----
      - id: "js_exec_file"
        name: "执行 JS 文件"
        desc: "测试 js.run('test.js') 从 assets/js/ 执行文件"
        type: "BUTTON"
        buttonColor: "blue"
        jsScript: |-
          var result = js.run("demo.js");
          "执行 demo.js 结果：" + result;

      # ----- 测试3：混合中英文 -----
      - id: "js_exec_cn"
        name: "中文别名测试"
        desc: "测试 js.运行()/js.执行() 中文别名"
        type: "BUTTON"
        buttonColor: "green"
        jsScript: |-
          var r1 = js.运行("new Date().getFullYear()");
          var r2 = js.执行("Math.PI");
          "年份：" + r1 + "，PI：" + r2;

      # ----- 测试4：动态生成代码 -----
      - id: "js_exec_dynamic"
        name: "动态代码生成"
        desc: "测试动态生成 JS 代码并执行"
        type: "BUTTON"
        buttonColor: "orange"
        jsScript: |-
          var a = 10;
          var b = 20;
          var code = "var x = " + a + "; var y = " + b + "; x + y;";
          var result = js.run(code);
          "动态执行结果：" + result;

      # ----- 分隔线 -----
      - id: "js_sep_1"
        name: ""
        desc: "────────────────────────────"
        type: "DESCRIPTION"

      # ----- 测试5：在 DESCRIPTION 中使用 {{js:}} 标签 -----
      - id: "js_desc_demo"
        name: "DESCRIPTION 动态文本"
        desc: "当前年份：{{js:new Date().getFullYear()}}"
        type: "DESCRIPTION"

      # ----- 测试6：在 INFO 中使用 JS -----
      - id: "js_info_demo"
        name: "INFO 动态信息"
        desc: "查看 JS 执行器测试结果"
        type: "INFO"
        infoValue: "点击测试按钮查看结果"
        jsScript: |-
          var year = js.run("new Date().getFullYear()");
          var pi = js.run("Math.PI.toFixed(2)");
          "年份：" + year + "\nPI 值：" + pi;

  # ==========================================
  # 栏目: HTTP 网络请求测试
  # 测试新增的 http(网络) 对象 API
  # ==========================================
  - id: "http_demo"
    title: "HTTP 网络请求测试"
    theme: "ORANGE"

    items:
      # ----- 测试1：简单 GET 请求 -----
      - id: "http_get_simple"
        name: "简单 GET 请求"
        desc: "测试 http.get() 请求 httpbin.org/get"
        type: "BUTTON"
        buttonColor: "orange"
        jsScript: |-
          var res = http.get("https://httpbin.org/get");
          var result;
          if (res.ok) {
              result = "状态码：" + res.status + "\n响应体：" + res.body;
          } else {
              result = "请求失败：" + res.status + " " + res.statusText;
          }
          result;

      # ----- 测试2：POST 请求发送 JSON -----
      - id: "http_post_json"
        name: "POST 发送 JSON"
        desc: "测试 http.post() 提交 JSON 数据"
        type: "BUTTON"
        buttonColor: "blue"
        jsScript: |-
          var payload = JSON.stringify({ name: "pvz2tool", value: 42 });
          var res = http.post("https://httpbin.org/post", payload, {
              contentType: "application/json"
          });
          var result;
          if (res.ok) {
              result = "状态：" + res.status + "\n" + res.body;
          } else {
              result = "POST 失败：" + res.status;
          }
          result;

      # ----- 测试3：PUT 请求 -----
      - id: "http_put_test"
        name: "PUT 请求测试"
        desc: "测试 http.put() 替换资源"
        type: "BUTTON"
        buttonColor: "green"
        jsScript: |-
          var body = JSON.stringify({ updated: true });
          var res = http.put("https://httpbin.org/put", body);
          var result;
          if (res.ok) {
              result = "PUT 成功：" + res.status;
          } else {
              result = "PUT 失败：" + res.status;
          }
          result;

      # ----- 测试4：DELETE 请求 -----
      - id: "http_delete_test"
        name: "DELETE 请求测试"
        desc: "测试 http.delete() 删除资源"
        type: "BUTTON"
        buttonColor: "red"
        jsScript: |-
          var res = http["delete"]("https://httpbin.org/delete");
          var result;
          if (res.ok) {
              result = "DELETE 成功：" + res.status;
          } else {
              result = "DELETE 失败：" + res.status;
          }
          result;

      # ----- 测试5：自定义请求头 -----
      - id: "http_headers"
        name: "自定义请求头"
        desc: "测试带自定义 headers 的 GET 请求"
        type: "BUTTON"
        buttonColor: "purple"
        jsScript: |-
          var res = http.get("https://httpbin.org/headers", {
              headers: {
                  "X-Custom-Header": "HelloPvz2",
                  "User-Agent": "Pvz2Tool/1.0"
              }
          });
          var result;
          if (res.ok) {
              result = "状态：" + res.status + "\n" + res.body;
          } else {
              result = "请求失败：" + res.status;
          }
          result;

      # ----- 测试6：读取响应头 -----
      - id: "http_response_headers"
        name: "读取响应头"
        desc: "测试从响应中读取 headers"
        type: "BUTTON"
        buttonColor: "orange"
        jsScript: |-
          var res = http.get("https://httpbin.org/response-headers?X-Demo=Hello");
          var result;
          if (res.ok) {
              var ct = res.headers["Content-Type"] || "unknown";
              result = "Content-Type：" + ct + "\n状态码：" + res.status;
          } else {
              result = "请求失败";
          }
          result;

      # ----- 测试7：通用 request 方法 -----
      - id: "http_generic_request"
        name: "通用 request 方法"
        desc: "测试 http.request() 指定 method"
        type: "BUTTON"
        buttonColor: "blue"
        jsScript: |-
          var res = http.request({
              url: "https://httpbin.org/anything",
              method: "PATCH",
              body: JSON.stringify({ patch: true }),
              contentType: "application/json",
              timeout: 15000
          });
          var result;
          if (res.ok) {
              result = "request 成功：" + res.status;
          } else {
              result = "request 失败：" + res.status;
          }
          result;

      # ----- 测试8：中文别名调用 -----
      - id: "http_cn_alias"
        name: "中文别名测试"
        desc: "测试网络.获取() 等中文别名"
        type: "BUTTON"
        buttonColor: "green"
        jsScript: |-
          var res = 网络.获取("https://httpbin.org/get");
          var result;
          if (res.ok) {
              result = "中文别名调用成功，状态码：" + res.status;
          } else {
              result = "调用失败：" + res.status;
          }
          result;

      # ----- 分隔线 -----
      - id: "http_sep_1"
        name: ""
        desc: "────────────────────────────"
        type: "DESCRIPTION"

      # ----- 测试9：超时设置 -----
      - id: "http_timeout"
        name: "超时测试"
        desc: "测试设置 timeout 参数（使用快速响应的 URL）"
        type: "BUTTON"
        buttonColor: "purple"
        jsScript: |-
          var res = http.get("https://httpbin.org/delay/1", {
              timeout: 5000
          });
          var result;
          if (res.ok) {
              result = "请求成功（未超时）：" + res.status;
          } else {
              result = "请求失败或超时：" + res.status;
          }
          result;

      # ----- 分隔线 -----
      - id: "http_sep_2"
        name: ""
        desc: "────────────────────────────"
        type: "DESCRIPTION"

      # ----- 测试10：INFO 显示 HTTP 状态 -----
      - id: "http_info_demo"
        name: "HTTP 状态检查"
        desc: "使用 INFO 显示远程 API 状态"
        type: "INFO"
        infoValue: "点击上方按钮测试 HTTP 功能"
        jsScript: |-
          var res = http.get("https://httpbin.org/get");
          var result;
          if (res.ok) {
              result = "HTTP 连接正常\n状态码：" + res.status + "\n响应 OK：" + res.ok;
          } else {
              result = "HTTP 连接异常\n状态码：" + res.status;
          }
          result;

  # ==========================================
  # 栏目 4: JS 工具
  # 类型: 按钮 (BUTTON)
  # 说明: 每个 item 点击后执行对应的 JS 脚本
  #       脚本支持 async/await，可调用 rton/rsb/ptx/pvz 等内置对象
  #
  # 按钮样式规则：
  #   - buttonColor（item 级）：可选 blue（默认）| red | green | orange | purple
  #   - 按钮布局规则：
  #       name 或 desc 有内容 → 左侧文字 + 右侧小按钮
  #       name 和 desc 均为空 → 渲染为全宽横条大按钮（与存档按钮风格一致）
  # ==========================================
  - id: "js_tools"
    title: "JS 工具"
#    isExpanded: true
    theme: "BLUE"

    items:
      # ---------- 示例4：数字加密解密 ----------
      - id: "encrypt_demo"
        name: "数字加密示例"
        desc: "演示 pvz 数字加密/解密（结果返回解密值）"
        type: "BUTTON"
        jsScript: |-
          var raw = 1000;
          var enc = raw.encrypt;
          var dec = enc.decrypt;
          dec

      - id: "pick_dir"
        name: ""
        desc: ""
        type: "BUTTON"
        buttonText: "选择解压目录"
        buttonColor: "purple"
        jsScript: |-
          var dir = picker.directory();
          var str = ""
          if (dir) {
            console.log("已选择目录：" + dir.path);
            str = "目录：" + dir.name;
          } else {
            str = "已取消选择";
          }
          str

      # 选择多个文件并复制到工作目录
      - id: "pick_files"
        name: ""
        desc: ""
        type: "BUTTON"
        buttonText: "导入多个图片"
        buttonColor: "green"
        jsScript: |-
