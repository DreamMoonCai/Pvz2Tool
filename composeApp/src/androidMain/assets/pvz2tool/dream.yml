    isUseExitConfirm: true
    exitConfirmButtonText: "确认退出"
    # 悬浮球关闭二次确认弹窗
    floatingExitConfirmTitle: "确认退出"
    floatingExitConfirmMessage: "确定要退出悬浮窗吗(直至重启游戏后显示)？"
    floatingExitConfirmButtonText: "确认"
    # 游戏画面子项默认值
    gameDisplay:
      isUseCustomGameDisplay: true       # 总开关默认关闭
      allowRotation: "允许随意翻转界面（支持竖屏）"
      isAllowRotation: false              # 默认不允许竖屏
      customWindowSize: "自定义窗口宽高"
      customWindowRatio: "自定义窗口比例"
      fullscreen: "全屏"
      displayMode: "ratio"           # 默认等比例（fullscreen / ratio / size）
      windowWidth: 0                      # displayMode=size 时的默认宽度（px，0 = 屏幕实际宽度）
      windowHeight: 0                     # displayMode=size 时的默认高度（px，0 = 屏幕实际高度）
      windowRatio: 1.5                    # displayMode=ratio 时的默认宽高比（1.5 = 3:2）
      # 比例/尺寸输入框提示文字
      ratioHint: "宽高比（支持 1.5 或 3:2）"
      widthHint: "宽度（dp）"
      heightHint: "高度（dp）"

  # 悬浮窗内容配置（动态可配置，与「栏目」BUTTON 项字段一致；示例默认展示断网与画面设置）
  floatingWindow:
    # 悬浮窗面板内按钮列表（按数组顺序从上到下排列），每个按钮点击后执行其 jsScript
    # 字段说明：
    #   id          必填，唯一标识
    #   name        按钮文字（不填则用 buttonText）。支持复合文本；写成 {{js:表达式}} 时，
    #               每次 jsScript 执行完毕都会自动重算，可实现「断网 ⇄ 恢复」这类文案自动翻转
    #   buttonText  按钮文字（可选，优先级高于 name），同样支持复合文本
    #   buttonColor 按钮颜色：blue(默认) | red | green | orange | purple
    #   icon        左侧图标资源名（相对于 assets/pvz2tool/images/，可选，预留）
    #   desc        按钮下方描述文字（可选，预留）
    #   jsScript    点击执行的 JS 脚本（支持 vpn.disconnect() / ui.showGameDisplay() 等全局 API）
    #   jsPath      脚本文件路径（jsScript 为空时从本地/APK 加载）
    #   isShowFromJs 可见性 JS 表达式：返回 true 才显示该按钮，不填=始终显示。
    #               与 name 一样会在每次脚本执行后自动重算，可实现运行时动态显隐。
    #               常用判定：vpn.isPrepared()（VPN 已授权）、ui.isCustomGameDisplayEnabled()（已开启自定义画面）
    #   isShowFromJsPath 可见性脚本文件路径（isShowFromJs 为空时生效），路径规则同 jsPath；读不到文件=隐藏
    # 注：isShowFromJs / isShowFromJsPath 同样可用在「栏目功能项」（sections[n].items[n]）上，用法完全一致
    emptyTip: "（悬浮窗暂无内容，请在 dream.yml 的 ui.floatingWindow.items 中配置）"
    allHiddenTip: "（当前没有可用的功能）"
    items:
      - id: vpn_toggle
        name: "{{js:vpn.isActive() ? '恢复网络' : '断开网络'}}"
        buttonColor: "red"
        isShowFromJs: "vpn.isPrepared()"
        jsScript: "vpn.isActive() ? vpn.restore() : vpn.disconnect();"
      - id: game_display
        name: "画面设置"
        buttonColor: "green"
        isShowFromJs: "ui.isCustomGameDisplayEnabled()"
        jsScript: "ui.showGameDisplay();"

  # 顶栏图标组（排在「设置」图标左侧，由 yml 配置，支持多个；图标资源来自 AssetExtractorHolder）
  # 字段说明：
  #   id          必填，唯一标识
  #   icon        正常态图标资源路径（相对工作目录 / 绝对路径 / URL / APK Assets，经 AssetExtractorHolder 解析）
  #   iconPress   按下态图标资源路径（同上）；不填则按下时复用 icon
  #   contentDescription 无障碍描述
  #   jsScript    点击执行的 JS 脚本（jsPath 为空时生效）
  #   jsPath      脚本文件路径（jsScript 为空时从本地工作目录 / APK 加载）
  #   isShowFromJs 可见性 JS 表达式：返回 true 才显示，不填=始终显示（与悬浮窗按钮一致，每次脚本执行后自动重算）
  #   isShowFromJsPath 可见性脚本文件路径（isShowFromJs 为空时生效）
  #   pressSound / releaseSound 音效文件名（相对 assets/pvz2tool/sound/）；不填默认用设置按钮音效
  topBarIcons:
    items:
      # 示例：一个「刷新」图标，点击执行 JS；仅在开启自定义画面时显示
      - id: refresh_top
        icon: "images/new_version_icon.png"
        iconPress: "images/new_version_icon.png"
        contentDescription: "刷新"
        isShowFromJs: "ui.isCustomGameDisplayEnabled()"
        jsScript: "ui.refreshAll();"
      # 示例：一个「帮助」图标，点击执行 jsPath 指向的脚本文件
      - id: help_top
        icon: "images/new_version_icon.png"
        contentDescription: "帮助"
        jsPath: "topbar/help.js"

  # JS 日志面板配置
  log:
    panelTitle: "JS 日志"
    copyLogDesc: "复制日志"
    clearLogDesc: "清空日志"
    noLogText: "暂无日志"
    presetSaveLabel: "预设存档"
    localSaveLabel: "本地存档"

  # 通用对话框按钮配置
  dialog:
    cancel: "取消"
    confirm: "确定"
    deleteSaveDesc: "删除存档"
    editUserNameDesc: "编辑用户名"
    shareSaveChooserTitle: "分享 PVZ2 存档"
    sharePackFailedTip: "打包存档失败"
    noShareableSaveTip: "没有可分享的本地存档"

  # 错误提示文案配置
  error:
    jsExecuteErrorTitle: "JS 执行出错"
    gameActivityInvalid: "设置的游戏Activity有误或不存在"
    unknownError: "未知错误"

  # 欢迎用户组件配置
  welcome:
    greetingTemplate: "欢迎您，%s"
    editUserNameTitle: "修改用户名"
    editUserNameHint: "请输入新的用户名"

  # 导出/导入兜底错误
  noValidDirTip: "未选择有效目录"


  # ── 功能属性（背景/视频/音乐/权限等）──
  # 注意：以下路径字段支持 URL（http:// 或 https://），检测到 URL 则直接使用
  assets:
    background: "bg_main.jpg"           # 背景图（支持 URL）
    isUseSolidColorBackground: true
    backgroundMusic: "bg_music.wav"       # 背景音乐（支持 URL）
    isPlayBackgroundMusic: true
    # CG 开场视频路径（相对于 assets/pvz2tool/video，支持 URL）
    cgVideoPath: "opening.mp4"
    # CG 开场视频超时时间，单位毫秒
    cgVideoLoadTimeout: 5000
    # CG 开场视频超时或报错是显示的海报图片
    cgVideoPoster: "bg_main.jpg"
    # ── 侧边背景图（相对于 assets/pvz2tool/images/）──
    sideBgImage: "game_side_bg.jpg"
    # ── 悬浮球图标（相对于 assets/pvz2tool/images/）──
    floatingBallIcon: "ic_floating_dave.png"

  # ── 音效文件名映射（相对于 assets/pvz2tool/sound/）──
  # 注意：支持 URL（http:// 或 https://），检测到 URL 则直接使用
  sounds:
    # 通用点击/开关（RADIO/CHECKBOX/列表条目等）
    switchClickPress: "ui_switch_click_press.wav"
    switchClickRelease: "ui_switch_click_release.wav"
    switchClick: "ui_switch_click.wav"
    # 普通按钮（PvzButton）
    buttonClickPress: "ui_button_click_press.wav"
    buttonClickRelease: "ui_button_click_release.wav"
    # 设置/编辑类按钮（小齿轮图标等）
    buttonSettingsPress: "ui_button_settings_press.wav"
    buttonSettingsRelease: "ui_button_settings_release.wav"
    # 关闭按钮（X 按钮）
    buttonXClosePress: "ui_button_x_close_press.wav"
    buttonXCloseRelease: "ui_button_x_close_release.wav"
    # 可折叠面板
    collapsiblePanelPress: "ui_collapsible_panel_click_press.wav"
    collapsiblePanelRelease: "ui_collapsible_panel_click_release.wav"

  versionLabel: "版本号："
  uiVersion: "V2.5.1"
  authorInfo: |-
    作者：{{green-shadow:松间烬雪}}
    特别感谢{{link-red-shadow|https://b23.tv/mVOm6n3:@汽水Boy Dream moon.}}制作调试界面
  tutorial: |-
    欢迎使用本应用！以下是详细教程：
    
    1. 联网问题
    最新版联网问题已解决，联网进入游戏若闪屏请狂点下方按钮直到不闪为止
    2. 安装问题
    显示系统不匹配安装失败请使用虚拟机（品牌不限），选安卓5-15任意机型即可
    3. 界面问题
    老版本全屏时会出现经典的令人难绷画面拉伸伸长，所以默认黑边
    4. 电脑版本
    电脑端可以使用安卓模拟器游玩，32位64位系统均可
    5. 音乐包
    音乐包的路径：可以使用es或者mt管理器 根目录/Android/data/com.pop cap.pvz2mgtz/files把音乐包里的egypt.rsb.smf替换进去即可，注意因为源码问题所以只能播放一种音乐，请自行选择
    6. 钻石获取
    钻石打主线关卡或通过活动获取
    7. 其他建议
    执意刷钱的玩家可以洗洗睡了
    
    最后祝玩家游玩愉快！

