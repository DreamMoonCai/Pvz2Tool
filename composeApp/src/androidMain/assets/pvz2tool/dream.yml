          ui.popup("我的设置", [
            { type: "switch", title: "开启省电模式", value: false, onChange: function (v) {
                console.log("省电模式 = " + v);
            } },
            { type: "arrow", title: "高级选项", onClick: function (nav) {
                // 进入子页面：子页面可再带 switch/text 等项
                nav.push({
                    title: "高级选项",
                    bottomText: "以下选项需谨慎修改",
                    items: [
                        { type: "switch", title: "实验性功能", value: true },
