# ==========================================
# 本地测试配置文件
# 作用：覆盖或追加 APK 内置的基础配置
# ==========================================

# ------------------------------
# 1. 基础字段覆盖
# ------------------------------
# 这里的配置会直接替换基础配置中的同名顶级字段
gameActivity: com.popcap.pvz2cmhd.TestActivity  # 测试覆盖游戏主 Activity

# ------------------------------
# 2. 版本配置 (Versions)
# ------------------------------
# 逻辑：按 ID 匹配。
#      - 如果基础配置中有相同 ID 的版本，则更新其字段；
#      - 如果没有，则新增该版本。
versions:
  - id: "new"                   # ID 匹配基础配置中的 "最新版"
    name: "本地修改版"           # 覆盖原有的 name 字段
    desc: "这是通过本地配置修改过的版本"

  # 你可以尝试取消下面的注释来测试新增一个版本
  # - id: "test"
  #   name: "测试版"
  #   desc: "本地新增的版本"
  #   default: false

# ------------------------------
# 3. 核心：动态栏目配置 (Sections)
# ------------------------------
sections:

  # ==========================================
  # 测试场景 A：追加模式 (addItems: true)
  # 用途：在不删除原有存档的前提下，添加新存档
  # ==========================================
  - id: "saves"                  # ID 匹配基础配置中的“存档管理”
    title: "存档管理 (本地追加)"  # 覆盖标题
    addItems: true                # 【核心参数】
      # 用法：true = 追加模式
      # 效果：本地配置的 items 会被添加到基础配置 items 列表的末尾。
    #       如果本地 item 的 ID 与基础 ID 冲突，则覆盖基础的那一项。

    items:
      - id: "save_local_1"       # 新 ID，会被追加
        name: "本地存档-全植物"
        type: "RAOID"
        desc: "通过本地配置添加"
        icon: "default_icon.png"
        default: false

      - id: "save_1"              # 旧 ID 冲突
        name: "初始存档 (已被本地修改)" # 基础配置中 save_1 的内容会被这个覆盖

  # ==========================================
  # 测试场景 B：替换模式 (addItems: false 或不写)
  # 用途：完全抛弃基础配置的列表，只使用本地的列表
  # ==========================================
  - id: "features"               # ID 匹配基础配置中的“功能管理”
    title: "功能管理 (本地替换)"
    addItems: false               # 【核心参数】
      # 用法：false (默认值) = 替换模式
      # 效果：基础配置中该栏目的 items 会被完全清空，只保留下面列出的 items。
    # 注意：即使下面 items 为空，基础的 items 也会被清空。
    visibleOnVersionIds: ["new", "old"] # 覆盖可见性，让新版和旧版都能看到

    items:
      - id: "local_feature_1"
        name: "本地功能-十倍阳光"
        desc: "仅在本地配置中存在"
        type: "CHECKBOX"
        icon: "auto_collect.png"

  # ==========================================
  # 测试场景 C：新增栏目
  # 用途：如果本地配置的 section ID 在基础中不存在，就是新增
  # ==========================================
  - id: "local_exclusive_section" # 全新的 ID
    title: "本地专属栏目"
    type: "DESCRIPTION"            # 纯文本类型
    isExpanded: true
    items:
      - id: "desc"
        desc: |-
          这是一个完全由本地配置新增的栏目。
          基础配置合并逻辑会保留原有的“存档管理”、“功能管理”等栏目，并把这个新栏目加在最后。
        type: "DESCRIPTION"

# ------------------------------
# 4. UI 文本覆盖
# ------------------------------
# 逻辑：对于对象类型（Map），采用深度合并。
#      即：只覆盖你写了的字段，没写的字段保留基础配置原样。
ui:
  title:
    topAppBar: "PVZ2 Tool · 本地配置版" # 只修改这一个标题，其他 about, coreFunction 等保持不变

  # 尝试取消注释修改进入游戏的按钮文字
  # button:
  #   enterGame: "开始战斗 (本地)"